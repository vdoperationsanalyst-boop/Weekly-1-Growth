<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Dairy - Forecast Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0C8542 0%, #065a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            color: #0C8542;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            padding: 15px 30px;
            background: #0C8542;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }
        
        .btn:hover {
            background: #065a2e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(12, 133, 66, 0.3);
        }
        
        .btn-secondary {
            background: #D81F26;
        }
        
        .btn-secondary:hover {
            background: #b81820;
        }
        
        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📊</div>
        <h1>Vijay Dairy Forecast</h1>
        <p>Weekly 1% Growth Analysis Dashboard</p>
        
        <div class="buttons">
            <a href="forecast_dashboard_2026_2029.html" class="btn">🏭 Plant 1% Growth</a>
            <a href="village_forecast_WITH_AVERAGES.html" class="btn btn-secondary">🏘️ Village 1% Growth</a>
        </div>
    </div>
</body>
</html>

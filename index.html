<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vijay Dairy Weekly 1% Growth Forecast Dashboard">
    <meta name="theme-color" content="#0C8542">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vijay Forecast">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230C8542' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='central' font-weight='bold'>VD</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230C8542' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='white' text-anchor='middle' dominant-baseline='central' font-weight='bold'>VD</text></svg>">
    
    <title>Vijay Dairy - Forecast Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0C8542 0%, #065a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #0C8542;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 15px 30px;
            background: #0C8542;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }
        
        .btn:hover {
            background: #065a2e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(12, 133, 66, 0.3);
        }
        
        .btn-secondary {
            background: #D81F26;
        }
        
        .btn-secondary:hover {
            background: #b81820;
        }
        
        .btn-install {
            background: #0066cc;
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        
        .btn-install:hover {
            background: #0052a3;
        }
        
        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .install-info {
            background: #e7f3ff;
            border: 2px solid #0066cc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #0066cc;
            display: none;
        }
        
        .install-info.show {
            display: block;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📊</div>
        <h1>Vijay Dairy Forecast</h1>
        <p>Weekly 1% Growth Analysis Dashboard</p>
        
        <div class="buttons">
            <a href="forecast_dashboard_2026_2029.html" class="btn">🏭 Plant 1% Growth</a>
            <a href="village_forecast_WITH_AVERAGES.html" class="btn btn-secondary">🏘️ Village 1% Growth</a>
        </div>
        
        <button id="installBtn" class="btn btn-install">📲 Install App</button>
        
        <div id="installInfo" class="install-info">
            💡 <strong>Pro Tip:</strong> Install this app to your phone for quick access!
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        const installBtn = document.getElementById('installBtn');
        const installInfo = document.getElementById('installInfo');

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                console.log('✓ Service Worker registered');
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }

        // Listen for beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
            installInfo.classList.add('show');
        });

        // Handle install button click
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                installBtn.style.display = 'none';
                installInfo.classList.remove('show');
            }
        });

        // Listen for app installed event
        window.addEventListener('appinstalled', () => {
            console.log('✓ App installed successfully');
            installBtn.style.display = 'none';
            installInfo.classList.remove('show');
        });
    </script>
</body>
</html>
